name: Build and Release iOS App (Unsigned for Sideloading)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g., v1.0.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build Unsigned IPA
    runs-on: macos-14
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: /Applications/Xcode_15.4.app/Contents/Developer
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer

      - name: Show Xcode version
        run: xcodebuild -version

      - name: List schemes
        run: xcodebuild -list -json

      - name: Resolve package dependencies
        run: xcodebuild -resolvePackageDependencies -scheme LocalAI

      - name: Build .app from Swift Package (unsigned)
        run: |
          xcodebuild clean build \
            -scheme LocalAI \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            -skipPackagePluginValidation \
            | xcpretty

      - name: Find .app
        id: find_app
        run: |
          APP_PATH=$(find build/DerivedData -name "LocalAI.app" -path "*/Build/Products/Release-iphoneos/*" | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "ERROR: Could not find LocalAI.app"
            find build/DerivedData -name "*.app" 2>/dev/null || true
            exit 1
          fi
          echo "app_path=$APP_PATH" >> $GITHUB_OUTPUT
          echo "Found app at: $APP_PATH"

      - name: Package IPA manually
        run: |
          APP_PATH="${{ steps.find_app.outputs.app_path }}"
          mkdir -p build/ipa/Payload
          cp -R "$APP_PATH" build/ipa/Payload/
          cd build/ipa
          zip -r LocalAI.ipa Payload
          echo "IPA created at: $(pwd)/LocalAI.ipa"

      - name: Find IPA
        id: find_ipa
        run: |
          IPA_PATH=$(find build/ipa -name "*.ipa" | head -1)
          echo "ipa_path=$IPA_PATH" >> $GITHUB_OUTPUT
          echo "Found IPA at: $IPA_PATH"

      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: ${{ steps.find_ipa.outputs.ipa_path }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}